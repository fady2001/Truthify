[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "src"
version = "0.0.1"
description = "An open-source web application that ingests a Youtube transcript (or any text transcript). extracts factual claims, checks each claim against reliable knowledge sources, and outputs a fact-check report with references and corrections."
authors = [
  { name = "ITI internship Team" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "langchain>=0.3.26",
    "langchain-community>=0.3.27",
    "langchain-google-genai>=2.0.10",
    "langchain-ollama>=0.3.5",
    "langgraph>=0.5.3",
    "loguru",
    "mkdocs",
    "nltk>=3.9.1",
    "ollama>=0.5.1",
    "pip",
    "pydantic>=2.11.7",
    "python-dotenv",
    "ruff",
    "tqdm",
    "typer",
]
requires-python = "~=3.11.0"


[tool.ruff]
line-length = 99
src = ["src"]
include = ["pyproject.toml", "src/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["src"]
force-sort-within-sections = true

